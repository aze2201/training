apiVersion: batch/v1
kind: Job

metadata:
  name: nextcloud-postgres-init
  namespace: nextcloud

spec:
  template:
    spec:
      restartPolicy: Never

      containers:
        - name: postgres-init
          image: postgres:16

          env:
            - name: PGHOST
              value: "postgres.database.svc.cluster.local"

            - name: PGPORT
              value: "5432"

            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secret
                  key: postgres-admin-user

            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secret
                  key: postgres-admin-password

            - name: NEXTCLOUD_DB
              value: "nextcloud"

            - name: NEXTCLOUD_USER
              value: "nextcloud"

            - name: NEXTCLOUD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secret
                  key: postgres-password

          command:
            - /bin/bash
            - -c
            - |
              set -e

              echo "Checking database..."

              DB_EXISTS=$(psql -tAc "SELECT 1 FROM pg_database WHERE datname='${NEXTCLOUD_DB}'")

              if [ "$DB_EXISTS" != "1" ]; then
                echo "Creating database..."
                psql -c "CREATE DATABASE ${NEXTCLOUD_DB};"
              fi

              USER_EXISTS=$(psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='${NEXTCLOUD_USER}'")

              if [ "$USER_EXISTS" != "1" ]; then
                echo "Creating user..."
                psql -c "CREATE USER ${NEXTCLOUD_USER} WITH PASSWORD '${NEXTCLOUD_PASSWORD}';"
              fi

              echo "Granting privileges..."

              psql -c "ALTER DATABASE ${NEXTCLOUD_DB} OWNER TO ${NEXTCLOUD_USER};"

              psql -c "GRANT ALL PRIVILEGES ON DATABASE ${NEXTCLOUD_DB} TO ${NEXTCLOUD_USER};"

              echo "PostgreSQL initialization complete."
