apiVersion: apps/v1
kind: Deployment

metadata:
  name: nextcloud
  namespace: nextcloud

  labels:
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/component: app
    app.kubernetes.io/part-of: nextcloud

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: nextcloud

  template:
    metadata:
      labels:
        app.kubernetes.io/name: nextcloud
        app.kubernetes.io/component: app
        app.kubernetes.io/part-of: nextcloud

        # Future NetworkPolicy labels
        access-db: "true"
        ingress-web: "true"
        auth-provider: keycloak

    spec:
      containers:
        - name: nextcloud
          image: nextcloud:30-apache

          command:
            - /bin/bash
            - -c
            - |
              /entrypoint.sh apache2-foreground &
              (
                sleep 90s
                /bin/bash /bootstrap/bootstrap.sh
              ) &
              wait

          ports:
            - containerPort: 80

          env:
            - name: POSTGRES_HOST
              value: "postgres.database.svc.cluster.local"

            - name: POSTGRES_PORT
              value: "5432"

            - name: POSTGRES_DB
              value: "nextcloud"

            - name: POSTGRES_USER
              value: "nextcloud"

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secret
                  key: postgres-password

            - name: NEXTCLOUD_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secret
                  key: nextcloud-admin-user

            - name: NEXTCLOUD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secret
                  key: nextcloud-admin-password

            - name: NEXTCLOUD_TRUSTED_DOMAINS
              value: "share.z-script.io"

            - name: OVERWRITEHOST
              value: "share.z-script.io"

            - name: OVERWRITEPROTOCOL
              value: "http"

            - name: OIDC_PROVIDER_URL
              value: "http://keycloak.keycloak.svc.cluster.local/realms/main"

            - name: OIDC_CLIENT_ID
              value: "nextcloud"

            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secret
                  key: client-secret

          volumeMounts:
            - name: nextcloud-data
              mountPath: /var/www/html

            - name: bootstrap-script
              mountPath: /bootstrap

          readinessProbe:
            httpGet:
              path: /status.php
              port: 80

            initialDelaySeconds: 30
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /status.php
              port: 80

            initialDelaySeconds: 60
            periodSeconds: 20

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"

            limits:
              cpu: "2"
              memory: "4Gi"

      volumes:
        - name: nextcloud-data
          persistentVolumeClaim:
            claimName: nextcloud-data

        - name: bootstrap-script
          configMap:
            name: nextcloud-bootstrap
            defaultMode: 0755
